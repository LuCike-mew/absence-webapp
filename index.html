<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирай — Пропуски</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #181818);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #242424);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --hint-color: var(--tg-theme-hint-color, #888888);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--hint-color);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--button-color);
            border-bottom-color: var(--button-color);
        }

        .content {
            padding: 16px;
            flex: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .pair-card, .history-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .pair-card {
            cursor: pointer;
        }

        .pair-card.selected {
            border-color: var(--button-color);
            background-color: rgba(36, 129, 204, 0.1);
        }

        .pair-info {
            display: flex;
            flex-direction: column;
        }

        .pair-num {
            font-size: 12px;
            color: var(--hint-color);
        }

        .pair-title {
            font-size: 15px;
            font-weight: 500;
            margin-top: 4px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--hint-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pair-card.selected .checkbox {
            background-color: var(--button-color);
            border-color: var(--button-color);
        }

        .checkbox::after {
            content: "";
            display: none;
            width: 5px;
            height: 9px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .pair-card.selected .checkbox::after {
            display: block;
        }

        .empty-state {
            color: var(--hint-color);
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            line-height: 1.5;
        }

        .history-date {
            font-size: 12px;
            color: var(--button-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-mark')">Отметить пропуск</button>
        <button class="tab-btn" onclick="switchTab('tab-history')">Мои пропуски</button>
    </div>

    <div class="content">
        <!-- Вкладка 1: Отметка -->
        <div id="tab-mark" class="tab-content active">
            <div class="header-title">Расписание на сегодня</div>
            <div id="pairs-container"></div>
        </div>

        <!-- Вкладка 2: История -->
        <div id="tab-history" class="tab-content">
            <div class="header-title">История всех пропусков</div>
            <div id="history-container"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Считываем данные, переданные ботом через URL
        const urlParams = new URLSearchParams(window.location.search);

        let pairs = [];
        let history = [];

        try {
            const rawPairs = urlParams.get('pairs');
            if (rawPairs) pairs = JSON.parse(decodeURIComponent(rawPairs));

            const rawHistory = urlParams.get('history');
            if (rawHistory) history = JSON.parse(decodeURIComponent(rawHistory));
        } catch (e) {
            console.error("Ошибка парсинга параметров:", e);
        }

        // Рендер пар на сегодня
        const pairsContainer = document.getElementById("pairs-container");
        const selectedPairs = new Set();

        if (pairs.length === 0) {
            pairsContainer.innerHTML = '<div class="empty-state">На сегодня пар не найдено или расписание еще не опубликовано.</div>';
        } else {
            pairs.forEach(pair => {
                const card = document.createElement("div");
                card.className = "pair-card";
                card.innerHTML = `
                    <div class="pair-info">
                        <span class="pair-num">Пара №${pair.num}</span>
                        <span class="pair-title">${pair.subject}</span>
                    </div>
                    <div class="checkbox"></div>
                `;

                card.addEventListener("click", () => {
                    if (selectedPairs.has(pair.num)) {
                        selectedPairs.delete(pair.num);
                        card.classList.remove("selected");
                    } else {
                        selectedPairs.add(pair.num);
                        card.classList.add("selected");
                    }

                    if (selectedPairs.size > 0) {
                        tg.MainButton.text = "Сохранить пропуски";
                        tg.MainButton.show();
                    } else {
                        tg.MainButton.hide();
                    }
                });

                pairsContainer.appendChild(card);
            });
        }

        // Рендер истории пропусков
        const historyContainer = document.getElementById("history-container");
        if (history.length === 0) {
            historyContainer.innerHTML = '<div class="empty-state">У вас пока нет отмеченных пропусков.</div>';
        } else {
            history.forEach(item => {
                const card = document.createElement("div");
                card.className = "history-card";
                card.innerHTML = `
                    <div class="pair-info">
                        <span class="history-date">${item.date} (Пара №${item.pair_num})</span>
                        <span class="pair-title">${item.subject}</span>
                    </div>
                `;
                historyContainer.appendChild(card);
            });
        }

        // Переключение вкладок
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabId === 'tab-mark') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                if (selectedPairs.size > 0) tg.MainButton.show();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                tg.MainButton.hide();
            }

            document.getElementById(tabId).classList.add('active');
        }

        // Обработка клика по кнопке "Сохранить"
        tg.MainButton.onClick(() => {
            const dataToSend = Array.from(selectedPairs).map(num => {
                const pair = pairs.find(p => p.num === num);
                return { pair_number: pair.num, subject: pair.subject };
            });
            tg.sendData(JSON.stringify(dataToSend));
        });
    </script>
</body>
</html>
